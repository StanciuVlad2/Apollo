services:
  eureka-server:
    image: apollo/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - apollo-network

  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!
    depends_on:
      - eureka-server
    networks:
      - apollo-network

networks:
  apollo-network:
    name: apollo-network
    driver: bridge
