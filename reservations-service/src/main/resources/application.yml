server:
  port: 8083

spring:
  application:
    name: reservations-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant?currentSchema=reservations
    username: ${DB_USER:restaurant}
    password: ${DB_PASS:restaurant}
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS reservations"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: reservations
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

app:
  token:
    secret: ${APP_TOKEN_SECRET:YOUR_JWT_SECRET_KEY_MIN_256_BITS}
    issuer: restaurant-app
    ttl-minutes: 30
