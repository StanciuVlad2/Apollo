server:
  port: 8088

spring:
  application:
    name: settings-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant?currentSchema=settings
    username: ${DB_USER:restaurant}
    password: ${DB_PASS:restaurant}
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS settings"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: settings

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

app:
  token:
    secret: ${APP_TOKEN_SECRET:YOUR_JWT_SECRET_KEY_MIN_256_BITS}
    issuer: restaurant-app
    ttl-minutes: 30
