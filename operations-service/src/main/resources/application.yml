server:
  port: 8082

spring:
  application:
    name: operations-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant?currentSchema=operations
    username: ${DB_USER:restaurant}
    password: ${DB_PASS:restaurant}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: operations
  elasticsearch:
    uris: http://${ES_HOST:localhost}:9200
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

app:
  token:
    secret: ${APP_TOKEN_SECRET:MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    issuer: restaurant-app
    ttl-minutes: 30
  upload:
    dir: uploads/menu-images
