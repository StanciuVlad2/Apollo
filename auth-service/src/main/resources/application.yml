server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant?currentSchema=auth
    username: ${DB_USER:restaurant}
    password: ${DB_PASS:restaurant}
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS auth"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:YOUR_GMAIL_ADDRESS}
    password: ${MAIL_PASS:YOUR_GMAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    test-connection: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

app:
  token:
    secret: ${APP_TOKEN_SECRET:YOUR_JWT_SECRET_KEY_MIN_256_BITS}
    issuer: restaurant-app
    ttl-minutes: 30
  email:
    from: ${MAIL_USER:YOUR_GMAIL_ADDRESS}
    verification:
      url: ${FRONTEND_URL:http://localhost:5173}/verify-email
