server:
  port: 8089

spring:
  application:
    name: vouchers-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant?currentSchema=vouchers
    username: ${DB_USER:restaurant}
    password: ${DB_PASS:restaurant}
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS vouchers"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: vouchers
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: vouchers-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.restaurant.vouchers.kafka"
        spring.json.value.default.type: "com.restaurant.vouchers.kafka.OrderCompletedEvent"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

app:
  token:
    secret: ${APP_TOKEN_SECRET:YOUR_JWT_SECRET_KEY_MIN_256_BITS}
    issuer: restaurant-app
    ttl-minutes: 30
