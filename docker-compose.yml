name: odin-restaurant-microservices

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5432:5432"
    networks:
      - apollo-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "restaurant"]
      interval: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - apollo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - apollo-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - apollo-network

  eureka-server:
    build: eureka-server/
    ports:
      - "8761:8761"
    networks:
      - apollo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      retries: 10

  auth-service:
    build: auth-service/
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
      - MAIL_USER=${MAIL_USER:-odin.dining@gmail.com}
      - MAIL_PASS=${MAIL_PASS:-uvza whcd cayb hmdn}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

  operations-service:
    build: operations-service/
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - ES_HOST=elasticsearch
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

  reservations-service:
    build: reservations-service/
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

  feedback-service:
    build: feedback-service/
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

  cocktails-service:
    build: cocktails-service/
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

  api-gateway:
    build: api-gateway/
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network

networks:
  apollo-network:
    name: apollo-network
    driver: bridge
