name: odin-restaurant-microservices

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apollo-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "restaurant"]
      interval: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - apollo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - apollo-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - apollo-network

  eureka-server:
    build: eureka-server/
    ports:
      - "8761:8761"
    networks:
      - apollo-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      retries: 10

  auth-service:
    build: auth-service/
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
      - MAIL_USER=${MAIL_USER:-odin.dining@gmail.com}
      - MAIL_PASS=${MAIL_PASS:-uvza whcd cayb hmdn}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  operations-service:
    build: operations-service/
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - ES_HOST=elasticsearch
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  reservations-service:
    build: reservations-service/
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
      - KAFKA_BOOTSTRAP=kafka:9092
      - TZ=Europe/Bucharest
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - apollo-network
    logging: *default-logging

  feedback-service:
    build: feedback-service/
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  cocktails-service:
    build: cocktails-service/
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyCd8y-pA503Jz6qJOMu2p-hcG5gcjMb_ms}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  reports-service:
    build: reports-service/
    ports:
      - "8086:8086"
    environment:
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  settings-service:
    build: settings-service/
    ports:
      - "8088:8088"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  vouchers-service:
    build: vouchers-service/
    ports:
      - "8089:8089"
    environment:
      - DB_HOST=postgres
      - DB_USER=restaurant
      - DB_PASS=restaurant
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  notifications-service:
    build: notifications-service/
    ports:
      - "8087:8087"
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - EUREKA_HOST=eureka-server
      - MAIL_USER=${MAIL_USER:-odin.dining@gmail.com}
      - MAIL_PASS=${MAIL_PASS:-uvza whcd cayb hmdn}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

  api-gateway:
    build: api-gateway/
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
      - APP_TOKEN_SECRET=${APP_TOKEN_SECRET:-MySuperSecretJWTKeyThatIsAtLeast256BitsLong!!}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - apollo-network
    logging: *default-logging

volumes:
  postgres_data:
  elasticsearch_data:

networks:
  apollo-network:
    name: apollo-network
    driver: bridge
